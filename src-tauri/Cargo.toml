[package]
name = "bookreader"
version = "1.0.0"
description = "Self-contained TTS reader powered by Gradium Phonon 31M"
authors = ["BookReader"]
edition = "2024"

[lib]
name = "bookreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "BookReader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
ptts = { version = "0.7.1", features = ["hf"] }
cpal = "0.18"
hound = "3.5"
mp3lame-encoder = "0.3"
regex = "1.13"
zip = "9.8"
roxmltree = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "json", "http2", "system-proxy"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
souvlaki = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
