name: Build Android APK & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-android:
    name: Android APK (arm64 + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri host tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK, NDK & Build-Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE_BIN="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name bin -type d | sort -V | tail -n 1)"
          if [[ -z "$CMDLINE_BIN" ]]; then
            echo "ERROR: Android cmdline-tools not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$CMDLINE_BIN:$SDK_ROOT/platform-tools:$PATH"
          (yes || true) | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          if [[ -d "$SDK_ROOT/ndk/27.2.12479018" ]]; then
            NDK_HOME_DIR="$SDK_ROOT/ndk/27.2.12479018"
          else
            NDK_HOME_DIR="$(find "$SDK_ROOT/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)"
          fi
          echo "NDK_HOME=$NDK_HOME_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME_DIR" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: android-arm64-x86_64

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify TypeScript, Vite & Rust tests (desktop + Android profile)
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features

      - name: Build signed Android APKs (arm64 + x86_64)
        run: |
          chmod +x android/build_android_apk.sh
          ./android/build_android_apk.sh split

      - name: Upload Android ARM64 APK (Phones/Tablets)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64
          path: android/dist/BookReader-android-arm64.apk
          if-no-files-found: error

      - name: Upload Android x86_64 APK (Windows Emulator)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-x86_64
          path: android/dist/BookReader-android-x86_64.apk
          if-no-files-found: error

  publish-android-release:
    name: Attach Android APK to Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-arm64
          path: release-assets

      - name: Download x86_64 APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-x86_64
          path: release-assets

      - name: Upload Android APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-assets/* --title "BookReader ${TAG}" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
