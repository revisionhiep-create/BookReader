name: Build Android APK & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK (arm64 + x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build-Tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          NDK_HOME_DIR="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)"
          echo "NDK_HOME=$NDK_HOME_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME_DIR" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-arm64-x86_64

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify TypeScript, Vite & Rust tests (desktop + Android profile)
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features

      - name: Build signed Android APKs (arm64 + x86_64)
        run: |
          chmod +x android/build_android_apk.sh
          ./android/build_android_apk.sh split

      - name: Upload Android ARM64 APK (Phones/Tablets)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64
          path: android/dist/BookReader-android-arm64.apk
          if-no-files-found: error

      - name: Upload Android x86_64 APK (Windows Emulator)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-x86_64
          path: android/dist/BookReader-android-x86_64.apk
          if-no-files-found: error

  publish-android-release:
    name: Attach Android APK to Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-arm64
          path: release-assets

      - name: Download x86_64 APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-x86_64
          path: release-assets

      - name: Upload Android APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "BookReader ${TAG}"
          fi
