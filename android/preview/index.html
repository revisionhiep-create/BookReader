<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookReader Android Multi-Device UI Lab</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0c0d;
        color: #ecece7;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, sans-serif;
        font-size: 13px;
        min-height: 100vh;
      }
      .lab-bar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: #141516;
        border-bottom: 1px solid #2a2b2d;
        padding: 10px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .lab-title {
        font-weight: 700;
        font-size: 14px;
        margin-right: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lab-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        background: #232622;
        border: 1px solid #3c4239;
        color: #c2cabd;
      }
      .lab-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding-right: 10px;
        border-right: 1px solid #28292b;
      }
      .lab-group:last-child {
        border-right: none;
      }
      .lab-btn {
        height: 30px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid #323335;
        background: #1d1e20;
        color: #d6d6d0;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .lab-btn:hover { background: #292a2d; color: #ffffff; }
      .lab-btn.active {
        background: #d4d6ce;
        color: #141413;
        border-color: #d4d6ce;
        font-weight: 600;
      }
      .lab-stage {
        padding: 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: center;
        gap: 24px;
      }
      .device-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .device-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #b4b4ad;
      }
      .device-tier {
        font-size: 10.5px;
        padding: 1px 7px;
        border-radius: 999px;
        background: #20221f;
        border: 1px solid #363934;
        color: #c5cdc0;
      }
      .device-bezel {
        position: relative;
        border-radius: 26px;
        padding: 10px;
        background: #1a1b1d;
        border: 2px solid #34363a;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      }
      .device-screen {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        background: #121211;
      }
      .device-screen iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
      .sim-notch {
        position: absolute;
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #070708;
        border: 1px solid #2b2c30;
        z-index: 10;
        pointer-events: none;
      }
      .sim-status-time {
        position: absolute;
        top: 5px;
        left: 14px;
        font-size: 10px;
        font-weight: 600;
        color: rgba(236, 236, 231, 0.65);
        z-index: 10;
        pointer-events: none;
      }
      .sim-gesture-pill {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 96px;
        height: 4px;
        border-radius: 999px;
        background: rgba(236, 236, 231, 0.35);
        z-index: 10;
        pointer-events: none;
      }
      .hidden-hw { display: none; }
    </style>
  </head>
  <body>
    <header class="lab-bar" id="lab-bar"></header>
    <main class="lab-stage" id="lab-stage"></main>
    <script type="module" src="/android/preview/preview.ts"></script>
  </body>
</html>
